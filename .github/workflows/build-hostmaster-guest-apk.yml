name: Build HostMaster Access Guest APK

on:
  push:
    paths:
      - 'hostmaster-access/guest-android/build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build guest Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostmaster-access/guest-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload guest APK
        uses: actions/upload-artifact@v4
        with:
          name: HostMasterAccess-Guest-APK
          path: hostmaster-access/guest-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
